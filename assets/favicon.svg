<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-labelledby="t">
    <title id="t">OpenMCAT</title>
    <style>
        .tile { fill: #14130F; }
        .ring { fill: none; stroke: #9DC9A9; stroke-width: 3.4; stroke-linecap: round; }
        .dot { fill: #EEE7D6; }
        @media (prefers-color-scheme: light) {
            .tile { fill: #F4EEDF; }
            .ring { stroke: #2E6A48; }
            .dot { fill: #1F1B14; }
        }
    </style>
    <rect class="tile" width="32" height="32" rx="4"/>
    <circle class="ring" cx="16" cy="16" r="9.5" transform="rotate(-20 16 16)" stroke-dasharray="48.5 11.2"/>
    <circle class="dot" cx="16" cy="16" r="2.8"/>
</svg>
